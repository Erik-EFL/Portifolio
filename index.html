<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      O endereço público vem de VITE_SITE_URL e é injetado aqui no build pelo
      plugin `site-url` (vite.config.js). canonical, og:url e og:image precisam
      ser absolutos — trocar de domínio é mudar uma variável só.
    -->
    <title>Erik Ferreira Lima | Desenvolvedor Full Stack JavaScript</title>
    <meta
      name="description"
      content="Portfólio de Erik Ferreira Lima, desenvolvedor full stack JavaScript: projetos em React, React Native, Node.js e TypeScript, habilidades e contato."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="author" content="Erik Ferreira Lima" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Erik Ferreira Lima" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Erik Ferreira Lima | Desenvolvedor Full Stack JavaScript"
    />
    <meta
      property="og:description"
      content="Portfólio de Erik Ferreira Lima, desenvolvedor full stack JavaScript: projetos em React, React Native, Node.js e TypeScript, habilidades e contato."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Card com o nome Erik Ferreira Lima, desenvolvedor full stack, e a stack React, React Native, Node.js e TypeScript"
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Erik Ferreira Lima | Desenvolvedor Full Stack JavaScript"
    />
    <meta
      name="twitter:description"
      content="Portfólio de Erik Ferreira Lima, desenvolvedor full stack JavaScript: React, React Native, Node.js e TypeScript."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Card com o nome Erik Ferreira Lima, desenvolvedor full stack"
    />

    <!-- %BASE_URL% mantém os ícones certos tanto na raiz do domínio quanto
         na subpasta do GitHub Pages -->
    <!-- Dados estruturados: é o que permite o Google montar o painel da pessoa
         (nome, cargo, perfis) em vez de tratar o site como uma página solta. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#person",
            "name": "Erik Ferreira Lima",
            "alternateName": "Erik-FL",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og-image.png",
            "jobTitle": "Desenvolvedor Full Stack",
            "description": "Desenvolvedor full stack JavaScript: React, React Native, Node.js e TypeScript.",
            "knowsLanguage": ["pt-BR", "en"],
            "knowsAbout": [
              "React",
              "React Native",
              "Node.js",
              "TypeScript",
              "JavaScript",
              "Desenvolvimento web",
              "Desenvolvimento mobile"
            ],
            "sameAs": [
              "https://github.com/Erik-EFL",
              "https://www.linkedin.com/in/erikferreiralima/",
              "https://www.instagram.com/oi.erik.lima/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Erik Ferreira Lima",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "%SITE_URL%/#person" }
          }
        ]
      }
    </script>

    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%image-512x512.svg" />
    <link rel="shortcut icon" href="%BASE_URL%image-512x512.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%image-192x192.png" />

    <!-- Evita flash de tema errado antes do JS aplicar data-theme -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBFBFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E1E1F" media="(prefers-color-scheme: dark)" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Erik-FL" />
    <meta name="application-name" content="Erik-FL" />
    <meta name="msapplication-TileColor" content="#1E1E1F" />
    <meta name="msapplication-TileImage" content="%BASE_URL%image-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
